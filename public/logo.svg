<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="100%" stop-color="#0d1b4b"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="200" height="200" rx="38" fill="url(#bg)"/>

  <!-- Heart shape -->
  <path d="M100 148
           C100 148 38 110 38 68
           C38 47 54 33 72 33
           C85 33 96 41 100 52
           C104 41 115 33 128 33
           C146 33 162 47 162 68
           C162 110 100 148 100 148Z"
        stroke="url(#hand)" stroke-width="9" stroke-linejoin="round" fill="none"/>

  <!-- Left arm of handshake -->
  <line x1="60" y1="88" x2="88" y2="102" stroke="url(#hand)" stroke-width="8" stroke-linecap="round"/>
  <!-- Right arm of handshake -->
  <line x1="140" y1="88" x2="112" y2="102" stroke="url(#hand)" stroke-width="8" stroke-linecap="round"/>
  <!-- Clasp -->
  <path d="M88 102 Q100 96 112 102" stroke="url(#hand)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left fingers -->
  <line x1="58" y1="88" x2="48" y2="104" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="66" y1="93" x2="57" y2="109" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="74" y1="98" x2="67" y2="113" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Right fingers -->
  <line x1="142" y1="88" x2="152" y2="104" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="134" y1="93" x2="143" y2="109" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="126" y1="98" x2="133" y2="113" stroke="url(#hand)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- ALLY text -->
  <text x="100" y="184"
        text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="34"
        letter-spacing="5"
        fill="white">ALLY</text>
</svg>
